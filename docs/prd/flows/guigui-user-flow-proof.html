body{font:14px/1.5 "PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#fafafa}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e4e4e8;padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
header h1{font-size:16px}
header .sub{color:#8a8a92;font-size:12px}
header button{border:1px solid #cfcfd6;background:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12.5px}
header button.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.legend{display:flex;gap:12px;font-size:12px;color:#666;align-items:center;margin-left:auto;flex-wrap:wrap}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
#wrap{overflow:auto;height:calc(100vh - 54px)}
#canvas{position:relative;width:2900px;height:1330px;background:
 linear-gradient(#fff,#fff),repeating-linear-gradient(0deg,transparent,transparent 39px,#f3f3f6 40px),
 repeating-linear-gradient(90deg,transparent,transparent 39px,#f3f3f6 40px);background-blend-mode:normal}
svg{position:absolute;inset:0}
.node{position:absolute;border:1.5px solid var(--grayline);background:var(--graybg);border-radius:22px;
 padding:6px 10px;font-size:12.5px;line-height:1.35;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.node.page{background:var(--purplebg);border-color:var(--purple);border-radius:26px;font-weight:600}
.node.note{background:var(--yellow);border-color:#e6d9a8;font-size:12px}
.node.add{border-style:dashed;background:#fff}
.node .tag{position:absolute;top:-9px;right:-6px;background:#fff;border:1px solid var(--purple);color:var(--purple);
 font-size:10px;border-radius:8px;padding:0 5px;line-height:1.5}
.node .tag.audit{border-color:#d99; color:var(--red)}
.node.dim{opacity:.25}
.node.lit{box-shadow:0 0 0 3px rgba(124,92,214,.28)}
.edge{stroke:#9a9aa4;stroke-width:1.4;fill:none}
.edge.cond{stroke-dasharray:0}
.edge.add{stroke:var(--purple);stroke-dasharray:5 4}
.edge.dim{opacity:.12}
.edge.lit{stroke:var(--purple);stroke-width:2.2}
.elabel{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid #ddd;border-radius:10px;
 font-size:11px;color:#555;padding:1px 7px;white-space:nowrap;pointer-events:none}
.elabel.add{color:var(--purple);border-color:var(--purple)}
.elabel.dim{opacity:.12}
.band{position:absolute;left:16px;font-size:13px;font-weight:700;color:#9a9aa4;letter-spacing:.12em}
#tip{position:fixed;z-index:50;max-width:340px;background:#232329;color:#fff;border-radius:10px;padding:9px 12px;
 font-size:12px;line-height:1.5;display:none;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#tip b{color:#cbb8ff}
.auditbadge{position:absolute;font-size:10px;color:var(--red);border:1px solid var(--red);border-radius:8px;
 padding:0 5px;background:#fff;display:none;z-index:5}
body.show-audit .auditbadge{display:block}

 if(A.x1>C.x2+20){p1=[A.x1,A.cy];q1=[C.x2+4,C.cy];
  const mx=(p1[0]+q1[0])/2;
  return [p1,q1,`M${p1[0]},${p1[1]} L${mx},${p1[1]} L${mx},${q1[1]} L${q1[0]},${q1[1]}`];}
 // 垂直主导
 p1=[A.cx,A.cy>A.y1&&true?(C.y1>A.y2?A.y2:C.y1):A.cy];p1=[A.cx,(C.y1>A.y2)?A.y2:(C.y2<A.y1?A.y1:A.cy)];
 q1=[C.cx,(C.y1>A.y2)?C.y1:(C.y2<A.y1?C.y2:C.cy)];
 return [p1,q1,`M${p1[0]},${p1[1]} L${q1[0]},${q1[1]}`];
}
svg.innerHTML='<defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#9a9aa4"/></marker><marker id="arrp" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#7c5cd6"/></marker></defs>';
const EN=[],host=svg;
E.forEach((e,i)=>{
 const [p1,q1,d]=port(e[0],e[1]);
 const add=Array.isArray(e[3])&&e[3].includes('add');
 const p=document.createElementNS('http://www.w3.org/2000/svg','path');
 p.setAttribute('d',d);p.setAttribute('class','edge'+(add?' add':''));
 p.setAttribute('marker-end',add?'url(#arrp)':'url(#arr)');
 p.dataset.from=e[0];p.dataset.to=e[1];
 host.appendChild(p);EN.push({el:p,from:e[0],to:e[1]});
});
const nhost=document.getElementById('nodes'),lhost=document.getElementById('labels');
N.forEach(n=>{
 const d=document.createElement('div');
 d.className='node '+n.t+(n.add?' add':'');
 d.style.left=n.x+'px';d.style.top=n.y+'px';d.style.width=(n.w||140)+'px';d.style.height=(n.h||46)+'px';
 d.textContent=n.l;d.dataset.id=n.id;
 if(n.tag){const t=document.createElement('span');t.className='tag';t.textContent=n.tag;d.appendChild(t);}
 if(n.a)d.dataset.audit=n.a;
 nhost.appendChild(d);
});
E.forEach(e=>{
 if(!e[2])return;
 const A=B[e[0]],C=B[e[1]];
 const lx=(A.cx+C.cx)/2,ly=(A.cy+C.cy)/2-14;
 const d=document.createElement('div');
 d.className='elabel'+((Array.isArray(e[3])&&e[3].includes('add'))||/拍板|先不管/.test(e[2])?' add':'');
 d.style.left=lx+'px';d.style.top=ly+'px';d.textContent=e[2];
 d.dataset.from=e[0];d.dataset.to=e[1];
 lhost.appendChild(d);
});
/* 交互:hover 高亮关联 */
function lit(id,on){
 document.querySelectorAll('.edge').forEach(p=>{
  const hit=p.dataset.from===id||p.dataset.to===id;
  p.classList.toggle('lit',on&&hit);p.classList.toggle('dim',on&&!hit);});
 document.querySelectorAll('.elabel').forEach(l=>{
  const hit=l.dataset.from===id||l.dataset.to===id;
  l.classList.toggle('dim',on&&!hit);});
 document.querySelectorAll('.node').forEach(n=>{
  n.classList.toggle('dim',on&&n.dataset.id!==id&&false);});
 const me=document.querySelector('.node[data-id="' + id + '"]');
 if(me)me.classList.toggle('lit',on);
}
document.querySelectorAll('.node').forEach(n=>{
 n.addEventListener('mouseenter',()=>lit(n.dataset.id,true));
 n.addEventListener('mouseleave',()=>lit(n.dataset.id,false));
 const tip=document.getElementById('tip');
 n.addEventListener('mousemove',ev=>{
  const a=n.dataset.audit;
  if(!a){tip.style.display='none';return}
  tip.style.display='block';
  tip.style.left=Math.min(ev.clientX+14,innerWidth-360)+'px';
  tip.style.top=(ev.clientY+14)+'px';
  tip.innerHTML='<b>审计标注</b>'+a;
 });
 n.addEventListener('mouseleave',()=>{document.getElementById('tip').style.display='none'});
});
function toggleAudit(btn){
 btn.classList.toggle('on');
 document.body.classList.toggle('show-audit');
 // 徽章:有 audit 的节点右上角红字 P*/D* 摘要
 if(!document.getElementById('badges').childElementCount){
  N.forEach(n=>{
   if(!n.a)return;
   const b=document.createElement('div');b.className='auditbadge';
   b.style.left=(n.x+(n.w||140)-46)+'px';b.style.top=(n.y-22)+'px';
   b.textContent='审计';document.getElementById('badges').appendChild(b);
  });
 }
}
