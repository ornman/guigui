body{font:14px/1.5 "PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:#fafafa}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #e4e4e8;padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}

header .sub{color:#8a8a92;font-size:12px}
header button{border:1px solid #cfcfd6;background:#fff;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:12.5px}

#canvas{position:relative;width:3160px;height:1420px;background:#fff;
 background-image:repeating-linear-gradient(0deg,transparent,transparent 39px,#f4f4f7 40px),repeating-linear-gradient(90deg,transparent,transparent 39px,#f4f4f7 40px)}
svg{position:absolute;inset:0}
.node{position:absolute;border:1.5px solid var(--grayline);background:var(--graybg);border-radius:20px;
 padding:5px 9px;font-size:12px;line-height:1.3;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;overflow:hidden}
.node.page{background:var(--purplebg);border-color:var(--purple);border-radius:24px;font-weight:600}
.node.note{background:var(--yellow);border-color:#e6d9a8;font-size:11.5px}
.node.add{border-style:dashed;background:#fff}
.node .tag{position:absolute;top:-9px;right:-6px;background:#fff;border:1px solid var(--purple);color:var(--purple);
 font-size:10px;border-radius:8px;padding:0 5px;line-height:1.5;white-space:nowrap}
.node.dim{opacity:.22}
.node.lit{box-shadow:0 0 0 3px rgba(124,92,214,.3);z-index:6}
.edge{stroke:#a2a2ac;stroke-width:1.4;fill:none}
.edge.add{stroke:var(--purple);stroke-dasharray:5 4}
.edge.dim{opacity:.1}
.edge.lit{stroke:var(--purple);stroke-width:2.2}
.elabel{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid #ddd;border-radius:10px;
 font-size:11px;color:#555;padding:1px 7px;white-space:nowrap;pointer-events:none;z-index:4}
.elabel.add{color:var(--purple);border-color:var(--purple)}
.band{position:absolute;left:16px;font-size:13px;font-weight:700;color:#9a9aa4;letter-spacing:.12em}
#tip{position:fixed;z-index:50;max-width:340px;background:#232329;color:#fff;border-radius:10px;padding:9px 12px;
 font-size:12px;line-height:1.5;display:none;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#tip b{color:#cbb8ff}
.auditbadge{position:absolute;font-size:10px;color:var(--red);border:1px solid var(--red);border-radius:8px;

body.show-audit .auditbadge{display:block}

function route(a,b){
 const A=B[a],C=B[b],yA=A.cy,yC=C.cy;
 if(Math.abs(yA-yC)<6&&C.x1>=A.x2-2)return[[A.x2,yA],[C.x1,yC]];
 if(Math.abs(yA-yC)<6&&A.x1>=C.x2+2)return[[A.x1,yA],[C.x2,yC]];
 if(C.x1>A.x2+8){const mx=(A.x2+C.x1)/2;return[[A.x2,yA],[mx,yA],[mx,yC],[C.x1,yC]];}
 if(A.x1>C.x2+8){const mx=(C.x2+A.x1)/2;return[[A.x1,yA],[mx,yA],[mx,yC],[C.x2,yC]];}
 if(C.y1>A.y2){const ch=(A.y2+C.y1)/2;return[[A.cx,A.y2],[A.cx,ch],[C.cx,ch],[C.cx,C.y1]];}
 const ch=(C.y2+A.y1)/2;return[[A.cx,A.y1],[A.cx,ch],[C.cx,ch],[C.cx,C.y2]];
}

E.forEach(e=>{
 const pts=route(e[0],e[1]);
 const add=(Array.isArray(e[3])&&e[3].includes('add'));
 const p=document.createElementNS('http://www.w3.org/2000/svg','path');
 p.setAttribute('d',d2path(pts));p.setAttribute('class','edge'+(add?' add':''));
 p.setAttribute('marker-end',add?'url(#arrp)':'url(#arr)');
 p.dataset.from=e[0];p.dataset.to=e[1];
 svg.appendChild(p);
 let best=null,bl=0;
 for(let i=0;i<pts.length-1;i++){const L=Math.abs(pts[i+1][0]-pts[i][0]);if(L>bl){bl=L;best=[(pts[i][0]+pts[i+1][0])/2,pts[i][1]]}}
 if(e[2]&&best){
  const d=document.createElement('div');
  d.className='elabel'+(add||/拍板|先不管/.test(e[2])?' add':'');
  d.style.left=best[0]+'px';d.style.top=(best[1]-8)+'px';d.textContent=e[2];
  d.dataset.from=e[0];d.dataset.to=e[1];
  document.getElementById('labels').appendChild(d);
 }
});
const nhost=document.getElementById('nodes');
N.forEach(n=>{
 const d=document.createElement('div');
 d.className='node '+n.t+(n.add?' add':'');
 d.style.left=n.x+'px';d.style.top=n.y+'px';d.style.width=(n.w||140)+'px';d.style.height=(n.h||46)+'px';
 d.textContent=n.l;d.dataset.id=n.id;
 if(n.tag){const t=document.createElement('span');t.className='tag';t.textContent=n.tag;d.appendChild(t);}
 if(n.a)d.dataset.audit=n.a;
 nhost.appendChild(d);
});
function lit(id,on){
 document.querySelectorAll('#svg .edge').forEach(p=>{
  const hit=p.dataset.from===id||p.dataset.to===id;
  p.classList.toggle('lit',on&&hit);p.classList.toggle('dim',on&&!hit);});
 document.querySelectorAll('.elabel').forEach(l=>{
  const hit=l.dataset.from===id||l.dataset.to===id;
  l.classList.toggle('dim',on&&!hit);});
 document.querySelectorAll('.node').forEach(n=>n.classList.toggle('lit',on&&n.dataset.id===id));
}
const tip=document.getElementById('tip');
document.querySelectorAll('.node').forEach(n=>{
 n.addEventListener('mouseenter',()=>lit(n.dataset.id,true));
 n.addEventListener('mouseleave',()=>{lit(n.dataset.id,false);tip.style.display='none'});
 n.addEventListener('mousemove',ev=>{
  if(!n.dataset.audit){tip.style.display='none';return}
  tip.style.display='block';
  tip.style.left=Math.min(ev.clientX+14,innerWidth-360)+'px';
  tip.style.top=(ev.clientY+14)+'px';
  tip.innerHTML='<b>审计标注</b>'+n.dataset.audit;
 });
});
function toggleAudit(btn){
 btn.classList.toggle('on');
 document.body.classList.toggle('show-audit');
 if(!document.getElementById('badges').childElementCount){
  N.forEach(n=>{
   if(!n.a)return;
   const b=document.createElement('div');b.className='auditbadge';
   b.style.left=(n.x+(n.w||140)-42)+'px';b.style.top=(n.y-20)+'px';
   b.textContent='审计';document.getElementById('badges').appendChild(b);
  });
 }
}
</script>
</body>
</html>
